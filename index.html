<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Samaun Mahmud — Full-stack Java developer</title>
    <meta
      name="description"
      content="Samaun Mahmud — Computer Science (AI) student at Brunel University London building real-time, full-stack systems with Java, Spring Boot and React."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the saved theme before first paint (no flash). Light is the default. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#121212'
        }
      } catch (e) {}
    </script>

    <!-- Open Graph: controls the preview card on LinkedIn, WhatsApp, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Samaun Mahmud — Full-stack Java developer" />
    <meta
      property="og:description"
      content="Real-time, data-heavy systems with Java, Spring Boot and React. Open to 2027 industrial placements."
    />
    <!-- Must be absolute for LinkedIn. Update if a custom domain is added. -->
    <meta property="og:url" content="https://samaun-dev.vercel.app/" />
    <meta property="og:image" content="https://samaun-dev.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://samaun-dev.vercel.app/" />

    <!-- Structured data so search engines understand who this site is about. Keep in sync with profile.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Samaun Mahmud",
        "url": "https://samaun-dev.vercel.app/",
        "jobTitle": "Full-stack Java developer",
        "description": "Computer Science (AI) student at Brunel University London building real-time, data-heavy applications with Spring Boot and React.",
        "affiliation": { "@type": "CollegeOrUniversity", "name": "Brunel University London" },
        "address": { "@type": "PostalAddress", "addressLocality": "Uxbridge, London", "addressCountry": "GB" },
        "knowsAbout": ["Java", "Spring Boot", "React", "TypeScript", "PostgreSQL", "MySQL", "WebSockets", "Docker"],
        "sameAs": ["https://github.com/samaunmahmud", "https://www.linkedin.com/in/samaun-mahmud"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
